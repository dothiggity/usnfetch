<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>usnfetch</title>
<link rel="icon" type="image/png" id="favicon" href="/static/icon-idle.png">
<link rel="stylesheet" href="/static/app.css">
<script>/* the saved look, before the first paint (app.js keeps it in step) */
try { const g = (k, d) => { const v = localStorage.getItem("usnf.ui." + k); return v == null ? d : JSON.parse(v); }, r = document.documentElement.dataset, t = g("theme", "dark");
  r.layout = g("layout", "side") === "rail" ? "rail" : "side"; r.density = g("density", "comfortable"); r.advanced = g("advanced", false) === true ? "on" : "off";
  r.theme = t === "system" ? (matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark") : t;
  r.tone = ["light", "famicom", "gameboy", "dreamcast"].includes(r.theme) ? "light" : "dark"; } catch (e) {}</script>
</head>
<body>
<div id="app">
  <aside class="side">
    <div class="brand">
      <img class="logo" id="logo" src="/static/icon-idle.png" alt="">
      <div>usnfetch<small id="ver">USN share manager</small></div>
    </div>
    <nav class="nav" id="nav"></nav>
    <div class="basket hidden" id="basket"></div>
  </aside>
  <main>
    <header class="top"><h1 id="title"></h1><div id="toolbar"></div></header>
    <section id="view"></section>
    <footer class="statusbar" id="statusbar" title="Open Activity"></footer>
  </main>
</div>
<div id="modal-root"></div>
<div id="toasts"></div>
<script type="module" src="/static/app.js"></script>
</body>
</html>
